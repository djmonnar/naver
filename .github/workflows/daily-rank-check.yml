name: Daily Naver rank check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  crawl:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: naver-place-tracker
    env:
      DATA_BACKEND: firestore
      FIREBASE_PROJECT_ID: naver-637b4
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: naver-place-tracker/requirements.txt

      - name: Check Firebase service account secret
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Add FIREBASE_SERVICE_ACCOUNT_JSON in GitHub repository secrets."
            exit 1
          fi

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run crawler
        run: python crawler.py
