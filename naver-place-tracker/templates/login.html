<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 | 플레이스 순위 트래커</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap');

  :root {
    --bg: #f6f8fb;
    --panel: #ffffff;
    --line: #d8e0ea;
    --text: #1e2532;
    --muted: #728096;
    --blue: #3478f6;
    --red: #f25f5c;
    --shadow: 0 12px 28px rgba(32, 45, 66, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    padding: 24px;
  }

  .panel {
    width: min(100%, 420px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 26px;
  }

  h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 900;
  }

  p {
    margin: 8px 0 22px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
  }

  button {
    width: 100%;
    min-height: 48px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    font: inherit;
    font-weight: 900;
  }

  button:disabled {
    cursor: wait;
    opacity: 0.6;
  }

  .google-mark {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: inline-grid;
    place-items: center;
    color: #fff;
    background: conic-gradient(from -45deg, #4285f4, #34a853, #fbbc05, #ea4335, #4285f4);
    font-size: 13px;
    font-weight: 900;
  }

  .message {
    min-height: 22px;
    margin-top: 14px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.55;
  }

  .message.error { color: var(--red); }

  .setup {
    border: 1px solid rgba(242, 95, 92, 0.35);
    background: rgba(242, 95, 92, 0.08);
    color: #b54040;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 16px;
    padding: 12px;
  }

  code {
    color: var(--text);
    font-size: 12px;
    font-weight: 800;
  }
</style>
</head>
<body>
  <main class="panel">
    <h1>네이버 순위 기록기</h1>
    <p>Google 계정으로 접속하면 플레이스와 키워드가 계정별로 분리됩니다.</p>

    {% if not firebase_ready %}
    <div class="setup">
      Firebase 웹 설정이 아직 없습니다.<br>
      <code>FIREBASE_API_KEY</code>, <code>FIREBASE_AUTH_DOMAIN</code>, <code>FIREBASE_PROJECT_ID</code>, <code>FIREBASE_APP_ID</code> 값을 넣어주세요.
    </div>
    {% endif %}

    <button id="googleLoginBtn" type="button" {% if not firebase_ready %}disabled{% endif %}>
      <span class="google-mark">G</span>
      Google로 시작하기
    </button>
    <div id="message" class="message"></div>
  </main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import {
  GoogleAuthProvider,
  browserLocalPersistence,
  getAuth,
  getRedirectResult,
  setPersistence,
  signInWithPopup,
  signInWithRedirect
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

const firebaseReady = {{ firebase_ready | tojson }};
const firebaseConfig = {{ firebase_config | tojson }};
const nextUrl = {{ next | tojson }};
const button = document.getElementById("googleLoginBtn");
const message = document.getElementById("message");
let auth = null;
let provider = null;

if (firebaseReady) {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  auth.languageCode = "ko";
  provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  await setPersistence(auth, browserLocalPersistence);

  const result = await getRedirectResult(auth).catch((error) => {
    showError(error);
    return null;
  });
  if (result) await createServerSession(result.user);
}

button.addEventListener("click", async () => {
  if (!auth || !provider) return;
  button.disabled = true;
  message.textContent = "Google 계정으로 연결 중입니다.";
  message.className = "message";

  try {
    const result = await signInWithPopup(auth, provider);
    await createServerSession(result.user);
  } catch (error) {
    if (["auth/popup-blocked", "auth/popup-closed-by-user", "auth/cancelled-popup-request"].includes(error.code)) {
      await signInWithRedirect(auth, provider);
      return;
    }
    showError(error);
    button.disabled = false;
  }
});

async function createServerSession(user) {
  const idToken = await user.getIdToken();
  const response = await fetch("/session/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ idToken })
  });

  if (!response.ok) {
    throw new Error("session_failed");
  }

  message.textContent = "로그인되었습니다.";
  window.location.href = nextUrl || "/";
}

function showError(error) {
  const code = error?.code || error?.message || "";
  let text = "로그인 중 오류가 발생했습니다.";
  if (code === "auth/unauthorized-domain") {
    text = "Firebase Authentication 승인 도메인에 현재 도메인을 추가해주세요.";
  } else if (code === "auth/operation-not-allowed") {
    text = "Firebase 콘솔에서 Google 로그인을 활성화해주세요.";
  } else if (code === "session_failed") {
    text = "서버 세션 생성에 실패했습니다. Firebase Admin 설정을 확인해주세요.";
  }
  message.textContent = text;
  message.className = "message error";
}
</script>
</body>
</html>
